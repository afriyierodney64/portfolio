<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Top browser / terminal bar -->
  <rect x="40" y="35" width="720" height="42" rx="8" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="56" r="6" fill="#ef4444"/>
  <circle cx="85" cy="56" r="6" fill="#eab308"/>
  <circle cx="105" cy="56" r="6" fill="#22c55e"/>
  <rect x="130" y="46" width="300" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="145" y="60" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">system://telemetry/node-preview</text>

  <!-- Tag Pill -->
  <rect x="635" y="46" width="110" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="690" y="60" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROPOSAL</text>

  <!-- Left Sidebar Panel -->
  <rect x="40" y="95" width="200" height="365" rx="10" fill="#1e293b" fill-opacity="0.35" stroke="#334155" stroke-width="1"/>
  <text x="60" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">TELEMETRY</text>
  
  <rect x="55" y="145" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="168" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">LATENCY</text>
  <text x="70" y="193" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold">12.4 ms</text>

  <rect x="55" y="215" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="238" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">UPTIME</text>
  <text x="70" y="263" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold">99.99%</text>

  <rect x="55" y="285" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="308" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">STATUS</text>
  <text x="70" y="333" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">ACTIVE</text>

  <rect x="55" y="355" width="170" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="378" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">CLUSTER HEALTH</text>
  <rect x="70" y="390" width="140" height="8" rx="4" fill="#1e293b"/>
  <rect x="70" y="390" width="120" height="8" rx="4" fill="#10b981"/>
  <text x="70" y="420" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Nodes: 12 Synchronized</text>

  <!-- Main Canvas Area -->
  <rect x="260" y="95" width="500" height="365" rx="10" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1"/>

  <!-- Futuristic Graph line -->
  <path d="M 290 230 Q 360 160, 420 210 T 540 180 T 650 240 T 730 190" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="420" cy="210" r="5" fill="#10b981"/>
  <circle cx="540" cy="180" r="5" fill="#059669"/>
  <circle cx="650" cy="240" r="5" fill="#10b981"/>
  <circle cx="730" cy="190" r="5" fill="#059669"/>

  <!-- Center Card -->
  <rect x="290" y="275" width="440" height="155" rx="10" fill="#0b0f19" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <text x="315" y="315" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">Contract Generator</text>
  <text x="315" y="345" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Interactive Digital Proposal Wizard</text>
  
  <rect x="315" y="370" width="150" height="32" rx="6" fill="url(#accent)"/>
  <text x="390" y="391" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MEDIA PLACEHOLDER</text>
  <text x="480" y="391" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Production Wireframe Preview</text>
</svg>